name: AIR-005 checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install torch==2.10.0 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install numpy==2.3.5 '.[research]'
      - run: python -m pytest -q
      - run: python scripts/verify_committed_results.py
      - run: python -m transformer_scratch.experiments
      - run: python scripts/notebooks.py
